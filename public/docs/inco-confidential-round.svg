<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" aria-labelledby="t d" role="img" viewBox="0 0 1200 640"><title id="t">Inco confidential round lifecycle</title><desc id="d">Lock, reveal and verified settlement.</desc><defs><linearGradient id="b"><stop stop-color="#080812"/><stop offset="1" stop-color="#17112d"/></linearGradient><marker id="a" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#a78bfa" d="M0 0l12 6-12 6z"/></marker></defs><rect width="1200" height="640" fill="url(#b)" rx="36"/><text x="70" y="85" fill="#fff" font-family="Arial" font-size="32" font-weight="700">One confidential game round</text><text x="70" y="122" fill="#a1a1aa" font-family="Arial" font-size="17">The browser coordinates transactions; it never invents the winning outcome.</text><g font-family="Arial"><g transform="translate(70 205)"><rect width="275" height="225" fill="#181827" stroke="#d946ef" rx="24"/><circle cx="55" cy="55" r="24" fill="#d946ef"/><text x="95" y="62" fill="#fff" font-size="23" font-weight="700">1. Lock</text><text x="30" y="120" fill="#d4d4d8" font-size="17">Wager + parameters enter</text><text x="30" y="150" fill="#d4d4d8" font-size="17">AptCasino.sol.</text><text x="30" y="192" fill="#f0abfc" font-size="16">e.rand() → sealed handle</text></g><g transform="translate(463 205)"><rect width="275" height="225" fill="#181827" stroke="#8b5cf6" rx="24"/><circle cx="55" cy="55" r="24" fill="#8b5cf6"/><text x="95" y="62" fill="#fff" font-size="23" font-weight="700">2. Reveal</text><text x="30" y="120" fill="#d4d4d8" font-size="17">Inco covalidators decrypt</text><text x="30" y="150" fill="#d4d4d8" font-size="17">the requested handle.</text><text x="30" y="192" fill="#c4b5fd" font-size="16">value + signed attestation</text></g><g transform="translate(856 205)"><rect width="275" height="225" fill="#181827" stroke="#10b981" rx="24"/><circle cx="55" cy="55" r="24" fill="#10b981"/><text x="95" y="62" fill="#fff" font-size="23" font-weight="700">3. Settle</text><text x="30" y="120" fill="#d4d4d8" font-size="17">Handle + signatures are</text><text x="30" y="150" fill="#d4d4d8" font-size="17">verified on Base Sepolia.</text><text x="30" y="192" fill="#6ee7b7" font-size="16">payout + ticket credits</text></g></g><path stroke="#a78bfa" stroke-width="4" marker-end="url(#a)" d="M355 317h90M748 317h90"/><rect width="1060" height="86" x="70" y="490" fill="#0f172a" stroke="#a78bfa" rx="22"/><text x="600" y="525" fill="#fff" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle">Core invariant</text><text x="600" y="555" fill="#cbd5e1" font-family="Arial" font-size="17" text-anchor="middle">No payout is calculated until the stored handle matches a valid Inco attestation.</text></svg>