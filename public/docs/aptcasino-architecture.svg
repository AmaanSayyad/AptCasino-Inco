<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">AptCasino protocol architecture</title><desc id="desc">Base wallet opens a round in AptCasino, Inco verifies the confidential result, and the reward vault buys a Megapot ticket NFT.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#111128"/><stop offset="1" stop-color="#250d31"/></linearGradient><linearGradient id="hot" x1="0" x2="1"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#a78bfa"/></marker></defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">AptCasino · Base Sepolia</text><text x="60" y="102" fill="#9ca3af" font-family="Arial,sans-serif" font-size="16">Confidential settlement connected to jackpot progression</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="60" y="245" width="210" height="120" rx="20" fill="#17172a" stroke="#475569"/><text x="165" y="294" fill="#fff" font-size="20" font-weight="700">Base wallet</text><text x="165" y="324" fill="#94a3b8" font-size="14">wager + gas</text>
  <rect x="355" y="205" width="250" height="200" rx="24" fill="url(#hot)"/><text x="480" y="275" fill="#fff" font-size="23" font-weight="700">AptCasino.sol</text><text x="480" y="310" fill="#f5e8ff" font-size="14">reserve · game rules</text><text x="480" y="338" fill="#f5e8ff" font-size="14">payout · credits</text>
  <rect x="690" y="95" width="220" height="130" rx="20" fill="#132c2a" stroke="#34d399"/><text x="800" y="148" fill="#fff" font-size="21" font-weight="700">Inco Lightning</text><text x="800" y="178" fill="#a7f3d0" font-size="14">sealed seed + attestation</text>
  <rect x="690" y="385" width="220" height="130" rx="20" fill="#2c1730" stroke="#f472b6"/><text x="800" y="438" fill="#fff" font-size="21" font-weight="700">Reward vault</text><text x="800" y="468" fill="#fbcfe8" font-size="14">credits + test USDC</text>
  <rect x="985" y="385" width="165" height="130" rx="20" fill="#2a2312" stroke="#fbbf24"/><text x="1068" y="435" fill="#fff" font-size="21" font-weight="700">Megapot</text><text x="1068" y="465" fill="#fde68a" font-size="14">ticket NFT</text></g>
  <g fill="none" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow)"><path d="M270 305H345"/><path d="M605 260C650 260 650 160 680 160"/><path d="M680 185C645 185 650 350 605 350"/><path d="M605 365C650 365 650 450 680 450"/><path d="M910 450H975"/></g>
  <g font-family="Arial,sans-serif" fill="#c4b5fd" font-size="13"><text x="282" y="290">play</text><text x="622" y="214">encrypted handle</text><text x="620" y="337">verify</text><text x="623" y="420">award</text><text x="928" y="435">buy</text></g>
</svg>
